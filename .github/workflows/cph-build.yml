name: CPH Build and Push

on:
  push:
    branches:
      - master-cph
  pull_request:
    branches:
      - master-cph
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

concurrency:
  group: cph-build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE: us-docker.pkg.dev/cph-ops-sre/cph-docker-images/atlantis
  WORKLOAD_IDENTITY_PROVIDER: projects/780244064715/locations/global/workloadIdentityPools/github-pool/providers/github-pool-provider
  SERVICE_ACCOUNT: gh-cph-gar-publisher@cph-ops-sre.iam.gserviceaccount.com

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    outputs:
      should-build: ${{ steps.changes.outputs.src == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - 'Dockerfile'
              - 'docker-entrypoint.sh'
              - '.github/workflows/cph-build.yml'
              - '**.go'
              - 'go.mod'
              - 'go.sum'

  lint:
    name: Lint Dockerfile
    needs: [changes]
    if: needs.changes.outputs.should-build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: "Dockerfile"

  build:
    name: Build and Push
    needs: [changes, lint]
    if: |
      needs.changes.outputs.should-build == 'true' &&
      (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Generate image tag
        id: tag
        run: |
          BRANCH="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          # Replace / with - for branch names like feature/foo
          BRANCH_CLEAN="${BRANCH//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="${BRANCH_CLEAN}-${SHORT_SHA}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Image will be tagged: ${TAG}"

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: alpine
          build-args: |
            ATLANTIS_BASE_TAG_TYPE=alpine
            ATLANTIS_VERSION=${{ steps.tag.outputs.tag }}
            ATLANTIS_COMMIT=${{ github.sha }}
            ATLANTIS_DATE=${{ github.event.head_commit.timestamp }}

  test:
    name: Test Image With Goss
    needs: [changes]
    if: needs.changes.outputs.should-build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and load into Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: |
            ATLANTIS_BASE_TAG_TYPE=alpine
          push: false
          load: true
          tags: "atlantis:goss-test"
          target: alpine
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Goss
        uses: e1himself/goss-installation-action@v1
        with:
          version: "v0.4.7"

      - name: Execute Goss tests
        run: |
          dgoss run --rm atlantis:goss-test bash -c 'while true; do sleep 1; done;'

  skip-build:
    name: Build and Push
    needs: [changes]
    if: needs.changes.outputs.should-build == 'false'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "No code changes detected, skipping build"
